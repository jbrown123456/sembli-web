packages:
  - 'apps/*'

# None of these postinstall scripts are required for mobile or web dev.
# Listed both in allowBuilds (explicit deny) and ignoredBuiltDependencies
# so pnpm 11 doesn't error out on first-time installs.
allowBuilds:
  '@sentry/cli': false
  core-js: false
  esbuild: false
  msw: false
  protobufjs: false
  sharp: false
  unrs-resolver: false

ignoredBuiltDependencies:
  - '@sentry/cli'
  - core-js
  - esbuild
  - msw
  - protobufjs
  - sharp
  - unrs-resolver
